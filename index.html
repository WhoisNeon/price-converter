<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مبدل قیمت</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f59e0b'/%3E%3Cstop offset='1' stop-color='%23d97706'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='256' height='256' rx='56' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='176 144 208 176 176 208'/%3E%3Cline x1='48' y1='176' x2='208' y2='176'/%3E%3Cpolyline points='80 112 48 80 80 48'/%3E%3Cline x1='208' y1='80' x2='48' y2='80'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="bg-layer"></div>

    <!-- Toast host (top center) -->
    <div class="toast-host" id="toastHost"></div>

    <main class="shell">
      <!-- Header -->
      <header class="header reveal" style="--d: 0">
        <div class="brand">
          <div class="monogram">
            <!-- phosphor: arrows-left-right -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
              <rect width="256" height="256" fill="none" />
              <polyline
                points="176 144 208 176 176 208"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="24"
              />
              <line
                x1="48"
                y1="176"
                x2="208"
                y2="176"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="24"
              />
              <polyline
                points="80 112 48 80 80 48"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="24"
              />
              <line
                x1="208"
                y1="80"
                x2="48"
                y2="80"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="24"
              />
            </svg>
          </div>
          <div class="brand-text">
            <h1>مبدل قیمت</h1>
            <p>تبدیل ارز به تومان با درصد افزایش</p>
          </div>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">آماده</span>
        </div>
      </header>
      <!-- Main receipt -->
      <div class="ticket-wrap reveal" style="--d: 1">
        <section class="ticket">
          <div class="ticket-head">
            <span class="th-title">برگهٔ تبدیل ارز</span>
            <span class="th-no">FORM 01 — FX</span>
          </div>

          <!-- Currency Selector -->
          <div class="card-section">
            <div class="section-label">ارز مبدأ</div>

            <div class="selector-wrap">
              <button
                class="selector-btn"
                id="selectorBtn"
                onclick="toggleDropdown(event)"
              >
                <img
                  class="flag"
                  id="selFlag"
                  src="https://raw.githubusercontent.com/HatScripts/circle-flags/refs/heads/gh-pages/flags/ae.svg"
                  alt=""
                />
                <div class="info">
                  <div class="code" id="selCode">AED — درهم امارات</div>
                  <div class="name" id="selName">
                    United Arab Emirates Dirham
                  </div>
                </div>
                <!-- phosphor: caret-down -->
                <svg
                  class="chev"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 256 256"
                >
                  <rect width="256" height="256" fill="none" />
                  <polyline
                    points="208,96 128,176 48,96"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  />
                </svg>
              </button>

              <div class="dropdown hidden" id="dropdown">
                <div class="search-wrap">
                  <!-- phosphor: magnifying-glass -->
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <rect width="256" height="256" fill="none" />
                    <circle
                      cx="116"
                      cy="116"
                      r="84"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="16"
                    />
                    <line
                      x1="175.4"
                      y1="175.4"
                      x2="224"
                      y2="224"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="16"
                    />
                  </svg>
                  <input
                    type="text"
                    id="searchInput"
                    placeholder="جستجو..."
                    oninput="filterCurrencies()"
                  />
                </div>
                <div class="currency-list" id="currencyList"></div>
              </div>
            </div>
          </div>
          <!-- Input & Percent -->
          <div class="card-section">
            <div class="input-grid">
              <div class="field">
                <div class="field-label-sm">مقدار ارز</div>
                <div class="input-wrap">
                  <input
                    type="text"
                    inputmode="decimal"
                    pattern="[0-9۰-۹.]*"
                    id="inputPrice"
                    class="input-visible"
                    value="۱"
                    placeholder="۱"
                    autocomplete="off"
                    oninput="onAmountInput(this)"
                    onblur="onAmountBlur(this)"
                  />
                  <span class="input-suffix" id="inputUnit">AED</span>
                </div>
              </div>

              <div class="field">
                <div class="field-label-sm">درصد افزایش</div>
                <div class="input-wrap">
                  <input
                    type="text"
                    inputmode="decimal"
                    pattern="[0-9۰-۹.]*"
                    id="customPercent"
                    class="input-visible"
                    value="۲۰"
                    placeholder="۲۰"
                    autocomplete="off"
                    oninput="onPercentInput(this)"
                    onblur="onPercentBlur(this)"
                  />
                  <span class="input-suffix">%</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Result -->
          <div class="result-section">
            <div class="result-label">قیمت نهایی</div>
            <div class="result-main" id="resultValue">
              <span id="resultNum">۰</span><span class="unit">تومان</span>
            </div>
            <div class="result-skeleton hidden" id="resultSkeleton"></div>
          </div>
        </section>
      </div>
      <!-- Actions -->
      <div class="actions reveal" style="--d: 2">
        <button class="btn btn-primary" id="copyBtn" onclick="copyResult()">
          <!-- phosphor: copy -->
          <svg
            class="icon-copy"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 256 256"
          >
            <rect width="256" height="256" fill="none" />
            <polyline
              points="168 168 216 168 216 40 88 40 88 88"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="24"
            />
            <rect
              x="40"
              y="88"
              width="128"
              height="128"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="24"
            />
          </svg>
          <!-- phosphor: check -->
          <svg
            class="icon-check"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 256 256"
          >
            <rect width="256" height="256" fill="none" />
            <polyline
              points="40 144 96 200 224 72"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="24"
            />
          </svg>
          <span id="copyBtnText">کپی نتیجه</span>
        </button>

        <button
          class="btn btn-secondary"
          id="refreshBtn"
          onclick="fetchPrice()"
        >
          <!-- phosphor: arrow-clockwise -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <rect width="256" height="256" fill="none" />
            <polyline
              points="184 104 232 104 232 56"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="24"
            />
            <path
              d="M188.4,192a88,88,0,1,1,1.83-126.23L232,104"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="24"
            />
          </svg>
          <span id="refreshBtnText">بروزرسانی</span>
        </button>
      </div>

      <!-- Alert -->
      <div class="alert hidden" id="alertBox">
        <div class="alert-icon">
          <!-- phosphor: warning -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <rect width="256" height="256" fill="none" />
            <path
              d="M142.41,40.22l87.07,154.4A15.92,15.92,0,0,1,216,216H40a15.92,15.92,0,0,1-13.48-21.38L113.59,40.22A15.92,15.92,0,0,1,142.41,40.22Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="16"
            />
            <line
              x1="128"
              y1="104"
              x2="128"
              y2="144"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="16"
            />
            <circle cx="128" cy="180" r="12" fill="currentColor" />
          </svg>
        </div>
        <div class="alert-body">
          <div class="alert-title" id="alertTitle">
            دسترسی به سرور ممکن نیست
          </div>
          <div class="alert-text" id="alertText">
            لطفاً <strong>فیلترشکن (VPN)</strong> خود را روشن کنید و دوباره تلاش
            کنید.
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer reveal" style="--d: 3">
        داده‌ها از
        <a href="https://chand.pages.dev" target="_blank" rel="noopener"
          >Chand API</a
        >
        <span class="sep">|</span>
        <span id="lastUpdate">—</span>
      </div>
    </main>

    <script src="src/script.js"></script>
  </body>
</html>
